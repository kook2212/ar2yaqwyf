<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTHK 本地新聞走馬燈</title>
<style>
  /* 網頁基本設定（黑色背景，適合電子看板） */
  body {
    background-color: #000000; /* 背景顏色：黑色 */
    color: #FFFFFF;          /* 文字顏色：白色 */
    font-size: 50px;         /* 字體大小：可以根據你的螢幕大小調大或調小 */
    font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 15px 0;
    overflow: hidden;        /* 隱藏捲軸 */
  }

  /* 走馬燈外層容器 */
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }

  /* 走馬燈動畫設定 */
  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%; /* 讓文字一開始藏在螢幕最右邊 */
    /* 這裡的 80s 代表捲動一圈需要 80 秒，數字越大捲動越慢，可自行修改 */
    animation: ticker 80s linear infinite; 
  }

  /* 定義捲動的動畫軌跡 */
  @keyframes ticker {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  /* 每條新聞之間的黃色分隔符號設計 */
  .separator {
    color: #FFCC00; /* 分隔號顏色：黃色 */
    margin: 0 40px; /* 分隔號左右的空白距離 */
  }
</style>
</head>
<body>

  <div class="ticker-wrap">
    <div class="ticker" id="news-ticker">
      正在載入最新香港電台本地新聞...
    </div>
  </div>

  <script>
    // 香港電台本地新聞 RSS 網址 (根據你提供的圖片)
    const rssUrl = "https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml";
    
    // 使用 rss2json 免費服務來避開 CORS 阻擋問題
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    function fetchNews() {
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'ok') {
            let newsText = "";
            
            // 讀取每一條新聞標題，並在後面加上黃色的菱形分隔號 ◆
            data.items.forEach(item => {
              newsText += `<span>${item.title}</span><span class="separator">◆</span>`;
            });
            
            // 將組合好的新聞文字放入網頁中
            document.getElementById('news-ticker').innerHTML = newsText;
            
            // 每次載入新資料時，重新啟動動畫確保排版正確
            const tickerElement = document.getElementById('news-ticker');
            tickerElement.style.animation = 'none';
            tickerElement.offsetHeight; /* 觸發重繪 */
            tickerElement.style.animation = null; 
          }
        })
        .catch(error => {
          console.error('讀取新聞發生錯誤:', error);
          document.getElementById('news-ticker').innerHTML = "暫時無法讀取新聞連線...<span class='separator'>◆</span>";
        });
    }

    // 網頁一打開就立刻抓取一次新聞
    fetchNews();
    
    // 設定計時器：每 15 分鐘 (900000 毫秒) 自動重新抓取最新新聞
    setInterval(fetchNews, 900000);
  </script>

</body>
</html>
